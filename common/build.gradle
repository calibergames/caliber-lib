// The loader-neutral library, compiled against vanilla Minecraft (Mojang names
// with Parchment parameter names). Its sources and resources are built into
// each loader's jar.
plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
	mcpVersion = minecraft_version
	accessTransformers = files('accesstransformer.cfg')
	parchment {
		minecraftVersion = minecraft_version
		mappingsVersion = parchment_mappings
	}
}

dependencies {
	compileOnly 'org.spongepowered:mixin:0.8.5'
	compileOnly 'org.jetbrains:annotations:24.0.1'
	// javax.annotation.Nullable; Forge's classpath has it, vanilla's does not.
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// The game tests, shared by every loader: compiled here against vanilla to
// check them, and built into each loader's test mod (caliberlib_gametest).
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

configurations {
	commonGametestJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonGametestResources {
		canBeResolved = false
		canBeConsumed = true
	}
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonGametestJava sourceSets.gametest.java.sourceDirectories.singleFile
	commonGametestResources sourceSets.gametest.resources.sourceDirectories.singleFile
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Unit tests see the same vanilla classes as the library, and vanilla's
// client resources (its models, textures and language file).
sourceSets {
	test {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.compileClasspath
	}
}

dependencies {
	// ModDevGradle's name for vanilla's client resources jar; if a plugin update renames it, the
	// engine tests fail on the first missing vanilla model or texture.
	testRuntimeOnly files(layout.buildDirectory.file("moddev/artifacts/vanilla-${minecraft_version}-client-extra-aka-minecraft-resources.jar")) {
		builtBy 'createMinecraftArtifacts'
	}
	// The texture tests read and write images through LWJGL (Minecraft 1.20.1 ships 3.3.1).
	['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64'].each { natives ->
		testRuntimeOnly "org.lwjgl:lwjgl:3.3.1:${natives}"
		testRuntimeOnly "org.lwjgl:lwjgl-stb:3.3.1:${natives}"
	}
}

// -PwriteGoldens rewrites the asset engine's goldens from the current output.
tasks.named('test', Test) {
	if (project.hasProperty('writeGoldens')) {
		systemProperty 'caliberlib.goldens.write', file('src/test/resources/goldens').absolutePath
	}
	// -Pfamilies, -PresourceJars and -PfamiliesOut run AllFamiliesTest on a family table.
	['families', 'resourceJars', 'familiesOut'].each { name ->
		if (project.hasProperty(name)) {
			systemProperty "caliberlib.${name}", project.property(name)
		}
	}
	if (project.hasProperty('families')) {
		// The table and jars are read at run time, so the task never counts as up to date.
		outputs.upToDateWhen { false }
	}
}

// The shared tests run in each loader's build; here they are compiled against vanilla.
tasks.named('check') {
	dependsOn 'gametestClasses'
}
