// One build for every loader: `common` holds the loader-neutral library,
// compiled against vanilla Minecraft; each loader subproject adds its own code
// and builds its own jar from both.
plugins {
	id 'fabric-loom' version '1.18.2' apply false
	id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
}
