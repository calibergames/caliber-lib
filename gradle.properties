org.gradle.jvmargs=-Xmx3G

# Minecraft
minecraft_version=1.20.1
# Every Minecraft version the Fabric jar claims.
minecraft_versions=1.20.1
parchment_mappings=2023.09.03
loader_version=0.19.5
fabric_version=0.92.12+1.20.1

# Mod
mod_id=caliberlib
mod_name=CaliberLib
mod_license=MIT
mod_version=0.2.9
mod_authors=CaliberMC
mod_description=Caliber Lib is a library mod containing various aspects of all of my mods. It is available for other \
  developers to use for integration with CaliberMC mods or for use on their own projects as well!  Caliber Lib does \
  nothing on its own and will be a required dependency for most of my mods as well as some other developers mods.
maven_group=com.calibermc.caliberlib
archives_base_name=caliberlib

# NeoForge 1.20.1 (the 47.1 fork of Forge 47; the jar also loads on Forge 1.20.1)
neoforge_version=1.20.1-47.1.106
# The FML major versions the jar loads on (mods.toml loaderVersion).
loader_version_range=[47,)
